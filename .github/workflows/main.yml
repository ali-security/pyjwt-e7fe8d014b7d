---
name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector forwarded to tox as posargs"
        type: string
        required: false
        default: ""

env:
  PIP_INDEX_URL: https://:2024-08-01@time-machines-pypi.sealsecurity.io/

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.platform }}"
    runs-on: "${{ matrix.platform }}"
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "pypy3.8", "pypy3.9"]

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"

        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true

      - name: "Install dependencies"
        run: |
          python -VV
          python -m site
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade coverage[toml] virtualenv tox tox-gh-actions

      - name: "Run tox targets for ${{ matrix.python-version }}"
        run: "python -m tox -- ${{ inputs.test-filter }}"

  package:
    name: "Build & verify package"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"

        with:
          python-version: "3.12"

      - name: "Install pinned setuptools, build and twine"
        run: 'python -m pip install "setuptools==72.1.0" build twine'

      - name: "Remove wheel so setuptools' vendored bdist_wheel is used"
        shell: bash
        run: |
          if python -m pip show wheel; then
            python -m pip uninstall -y wheel
          fi

      - name: "Build package"
        run: "python -m build --no-isolation"

      - name: "List result"
        run: "ls -l dist"

      - name: "Verify wheel Generator is setuptools (72.1.0)"
        shell: bash
        run: |
          if unzip -p dist/*.whl '*.dist-info/WHEEL' | grep -F 'Generator: setuptools (72.1.0)'; then
            echo "Wheel Generator matches setuptools (72.1.0)"
          else
            echo "::error::Wheel Generator is not setuptools (72.1.0)"
            unzip -p dist/*.whl '*.dist-info/WHEEL'
            exit 1
          fi

      - name: "Check long_description"
        run: "python -m twine check dist/*"

      - uses: "actions/upload-artifact@v4"
        with:
          name: "dist"
          path: "dist/*"
          if-no-files-found: error

  install-dev:
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest"]

    name: "Verify dev env"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"

        with:
          python-version: "3.8"

      - name: "Install in dev mode"
        run: "python -m pip install -e .[dev]"

      - name: "Import package"
        run: "python -c 'import jwt; print(jwt.__version__)'"
